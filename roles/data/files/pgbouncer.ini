; OpenVibe data role (ADR-035): PgBouncer in transaction-pooling mode (ADR-007 2026-09-24 rule 1).
; Applications use DATABASE_URL (port 6432); migrations use DATABASE_DIRECT_URL (port 5432).
[databases]
; Live is the busiest service (chat, viewers, analytics): its own pool, above the default 5 (2026-10-08, plan T4).
ov_live = host=127.0.0.1 port=5432 pool_size=10 max_db_connections=20
* = host=127.0.0.1 port=5432

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
unix_socket_dir = /var/run/postgresql
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_user = pgbouncer_auth
auth_dbname = postgres
auth_query = SELECT usename, passwd FROM pgbouncer.get_auth($1)
pool_mode = transaction
max_client_conn = 2000
; Pools are per database/user and ~30 services share one PostgreSQL (max_connections 200): small pools, idle server
; connections closed after a minute, and a per-database cap, so no burst can take every server slot (2026-10-08: a
; boot-time migration on the direct URL found none left). A busy database can get its own pool_size under [databases].
default_pool_size = 5
min_pool_size = 0
reserve_pool_size = 2
max_db_connections = 10
server_idle_timeout = 60
query_wait_timeout = 30
ignore_startup_parameters = extra_float_digits,options,application_name
stats_users = ov_monitor
admin_users = pgbouncer_auth
; Pooler errors are logged; each client's login and close are not: services' pools reconnect all the time, and those
; two lines were ~31,000 a three-hour window in the journal (2026-10-23), next to nothing worth reading.
log_connections = 0
log_disconnections = 0
logfile = /var/log/postgresql/pgbouncer.log
pidfile = /var/run/postgresql/pgbouncer.pid
