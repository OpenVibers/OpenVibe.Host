# OpenVibe data role (ADR-035): Valkey is shared and never authoritative (ADR-007 2026-09-24 rule 4).
# Included from /etc/valkey/valkey.conf by roles/data/provision.sh.
bind 127.0.0.1 -::1
port 6379
protected-mode yes
maxmemory 768mb
maxmemory-policy volatile-lru     # only keys with a TTL (caches) are evicted; queues and counters are not
appendonly yes
appendfsync everysec
aclfile /etc/valkey/users.acl
