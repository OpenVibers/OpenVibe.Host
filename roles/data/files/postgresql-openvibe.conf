# OpenVibe data role (ADR-035): PostgreSQL 18 settings, installed as conf.d/openvibe.conf by roles/data/provision.sh.
# Sized for the shared host (4 vCPU, 15 GB RAM) until the data role has its own machine; revisit then.
listen_addresses = '127.0.0.1'          # the private network address is added when a second host joins (WS-X1)
port = 5432
max_connections = 120                   # applications connect through PgBouncer (transaction pooling)
password_encryption = scram-sha-256

shared_buffers = 1GB
effective_cache_size = 4GB
work_mem = 16MB
maintenance_work_mem = 256MB
random_page_cost = 1.1                  # SSD
effective_io_concurrency = 200

wal_level = replica
max_wal_senders = 5
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_completion_target = 0.9
archive_mode = on
archive_timeout = 300                   # at most 5 minutes of WAL outside the repository
# archive_command is set by provision.sh in conf.d/openvibe-archive.conf (pgBackRest when a repository is configured)

shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
log_min_duration_statement = 500ms
log_line_prefix = '%m [%p] %q%u@%d '
log_lock_waits = on
idle_in_transaction_session_timeout = 60s
