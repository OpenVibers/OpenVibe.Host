# OpenVibe alert rules (roadmap Track O), loaded by the host's Prometheus (rule_files in the config
# scripts/prometheus-config.js renders). Firing alerts are read at GET 127.0.0.1:9090/api/v1/alerts by
# `ovhost alerts relay` (openvibe-alerts.timer, every 2 minutes; lib/alerts.js), which sends them to
# OpenVibe.Network: severity page pages the operator at once (critical), ticket at high priority, and each
# alert is reminded daily while open and announced when it resolves (docs/operator-alerts.md).
groups:
  - name: openvibe
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.process }} ({{ $labels.instance }}) has not answered /metrics for 5 minutes"
      - alert: HighErrorRate
        expr: |
          sum by (service) (rate(http_requests_total{status=~"5.."}[10m]))
            / clamp_min(sum by (service) (rate(http_requests_total[10m])), 0.05) > 0.05
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "{{ $labels.service }}: more than 5% of requests answered 5xx for 10 minutes"
      - alert: DiskAlmostFull
        expr: node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} < 0.10
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "Root filesystem has less than 10% free ({{ $value | humanizePercentage }})"
      - alert: MemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.08
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "Less than 8% of memory available for 10 minutes"
      # Nightly backups (ovhost backup --all, openvibe-backup.timer; metrics from lib/commands/backup.js
      # through node_exporter's textfile collector; roadmap WS-S task 3).
      - alert: OpenVibeBackupFailed
        expr: openvibe_backup_last_run_ok == 0
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "The last ovhost backup --all run failed ({{ with query \"openvibe_backup_services{status='failed'}\" }}{{ . | first | value }}{{ end }} service(s) failed, or the off-site copy)"
      - alert: OpenVibeBackupMissed
        expr: time() - openvibe_backup_last_success_timestamp_seconds > 30 * 3600 or absent(openvibe_backup_last_run_timestamp_seconds)
        for: 30m
        labels: { severity: page }
        annotations:
          summary: "No successful nightly backup for more than 30 hours (or no backup metrics at all)"
      # Production drift (OpenVibe.Network registry/deploy-drift.js, hourly against GitHub; WS-S task 7).
      - alert: OpenVibeDeployDrift
        expr: openvibe_deploy_drift_seconds > 24 * 3600
        for: 1h
        labels: { severity: ticket }
        annotations:
          summary: "{{ $labels.service }}: main has had commits production does not run for more than a day"
      # The developer path against production, daily (openvibe-devpath.timer; WS-N task 1).
      - alert: OpenVibeDeveloperPathFailed
        expr: openvibe_devpath_last_run_ok == 0
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: "The daily developer path failed ({{ with query \"openvibe_devpath_steps_failed\" }}{{ . | first | value }}{{ end }} step(s)): a developer cannot go from an account to Media and Events"
      - alert: OpenVibeDeveloperPathMissed
        expr: time() - openvibe_devpath_last_success_timestamp_seconds > 30 * 3600
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: "No passing developer-path run for more than 30 hours"
      # The Tools job proof against production, every six hours (openvibe-toolsjob.timer; WS-L task 4).
      - alert: OpenVibeToolsJobProofFailed
        expr: openvibe_toolsjob_last_run_ok == 0
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: "The Tools job proof failed ({{ with query \"openvibe_toolsjob_steps_failed\" }}{{ . | first | value }}{{ end }} step(s)): a converter job, its Media result or its tools.job.* events did not come through"
      - alert: OpenVibeToolsJobProofMissed
        expr: time() - openvibe_toolsjob_last_success_timestamp_seconds > 13 * 3600
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: "No passing Tools job proof for more than 13 hours (two runs)"
      # The release UX check (ovhost browser-watch, openvibe-browsercheck.timer; WS-H task 11): each watched site
      # in a real browser after every release and daily, as ovcheck; a failure is confirmed by a second run.
      - alert: OpenVibeBrowserCheckFailed
        expr: openvibe_browser_check_ok == 0
        for: 1m
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.service }}: the browser check of release {{ $labels.release }} failed ({{ with printf \"openvibe_browser_check_failing_checks{service='%s'}\" $labels.service | query }}{{ . | first | value }}{{ end }} failing check(s)); run: sudo ovhost browser-watch --sites {{ $labels.service }} --force"
      - alert: OpenVibeBrowserCheckMissed
        expr: time() - openvibe_browser_check_last_run_timestamp_seconds > 26 * 3600
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: "{{ $labels.service }}: no browser check has run to the end for more than 26 hours"
      # The relay itself (openvibe-alerts.timer; WS-H task 11). It cannot page while it is broken; it pages
      # this as soon as a run gets through again, so an outage of the pager is never silent afterwards.
      - alert: OpenVibeAlertRelayFailing
        expr: time() - openvibe_alert_relay_last_success_timestamp_seconds > 15 * 60
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "Operator alerts were not delivered for more than 15 minutes (ovhost alerts relay: Prometheus, the token or Network)"
