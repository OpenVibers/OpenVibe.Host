<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<title>Back in a moment · OpenVibe</title>
<style>
  :root { --bg: #0a0f1c; --card: #111a2b; --ink: #eef1f6; --ink2: #a9b4c8; --mute: #8c99b0; --line: #1c2840; --acc: #ff7a1a; }
  @media (prefers-color-scheme: light) { :root { --bg: #f7f7f8; --card: #ffffff; --ink: #1a1a2e; --ink2: #4a4a6a; --mute: #68687b; --line: #e0e0e6; --acc: #e8590c; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 16px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); }
  main { width: 100%; max-width: 420px; text-align: center; }
  .mark { width: 64px; height: 64px; margin: 0 auto 22px; position: relative; }
  .mark::before { content: ""; position: absolute; inset: 0; border-radius: 20px; background: radial-gradient(circle at 35% 30%, #ffb36b, var(--acc) 60%, #c2410c); box-shadow: 0 18px 40px -16px rgba(255, 122, 26, .55); }
  .mark::after { content: ""; position: absolute; inset: 18px; border-radius: 50%; border: 4px solid rgba(255, 255, 255, .92); border-top-color: transparent; animation: spin 1.1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .mark::after { animation: none; border-top-color: rgba(255, 255, 255, .92); } }
  h1 { margin: 0 0 8px; font-size: 1.5rem; line-height: 1.2; letter-spacing: -.01em; text-wrap: balance; }
  p { margin: 0 auto; color: var(--ink2); max-width: 34ch; }
  .card { margin-top: 22px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--mute); font-size: .88rem; }
  .card b { color: var(--ink); font-weight: 650; }
  .row { margin-top: 18px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  a, button { font: inherit; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-weight: 650; text-decoration: none; cursor: pointer; }
  .btn.acc { background: var(--acc); border-color: var(--acc); color: #0a0f1c; }
  .host { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"></div>
  <h1>Back in a moment</h1>
  <p><span class="host" id="host">This site</span> is restarting, usually for an update. It takes a few seconds.</p>
  <div class="card" role="status" aria-live="polite" id="status">This page reloads by itself as soon as the site is back.</div>
  <div class="row">
    <button class="btn acc" type="button" id="retry">Try now</button>
    <a class="btn" href="https://openvibe.network/">OpenVibe home</a>
  </div>
</main>
<script>
(function () {
  var host = location.hostname.replace(/^www\./, '');
  document.getElementById('host').textContent = host || 'This site';
  var status = document.getElementById('status');
  var tries = 0;
  function check() {
    tries++;
    // A HEAD of this same address: anything but 502/503/504 means the service answers again.
    fetch(location.href, { method: 'HEAD', cache: 'no-store', credentials: 'same-origin' }).then(function (r) {
      if (r.status !== 502 && r.status !== 503 && r.status !== 504) { location.reload(); return; }
      next();
    }, next);
  }
  function next() {
    var wait = Math.min(15000, 2000 + tries * 1000);
    if (tries > 4) status.innerHTML = 'Still restarting. Checking again in <b>' + Math.round(wait / 1000) + ' s</b>.';
    if (tries > 40) { status.textContent = 'This is taking longer than usual. The team has been told; try again in a few minutes.'; return; }
    setTimeout(check, wait);
  }
  document.getElementById('retry').addEventListener('click', function () { location.reload(); });
  setTimeout(check, 2000);
})();
</script>
<noscript><meta http-equiv="refresh" content="8"></noscript>
</body>
</html>
