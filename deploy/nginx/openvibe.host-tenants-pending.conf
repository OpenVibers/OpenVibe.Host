# *.openvibe.host before Host Stage B tenant hosting launches: a clear 404 over the wildcard
# certificate instead of falling through to the default server (which served another site).
# `ovhost nginx tenants host --install` removes it in the same nginx -t and reload that installs the
# real tenant vhost (nginx.tenants.replaces); see docs/launch.md.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name *.openvibe.host;
    ssl_certificate     /etc/letsencrypt/live/openvibe.host/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.host/privkey.pem;
    add_header Cache-Control "no-store" always;
    location / { default_type text/plain; return 404 "No site is published at this address yet.\n"; }
}
server {
    listen 80;
    listen [::]:80;
    server_name *.openvibe.host;
    return 301 https://$host$request_uri;
}
