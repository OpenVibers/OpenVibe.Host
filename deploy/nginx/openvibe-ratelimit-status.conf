# OpenVibe host: what a rate limit answers. nginx answers 503 by default when limit_req or limit_conn refuses a request,
# which tells a browser, a crawler and the uptime checks that the site is down. A limit is not an outage: answer 429.
#
# Installed as /etc/nginx/sites-available/openvibe-ratelimit-status.conf (enabled) with ov-vhost-install. sites-enabled/*
# is included inside nginx.conf's http block, so these are the http-level defaults every server block inherits; a vhost
# that sets its own status keeps it. Found 2026-10-14: 19 of the 39 vhosts that rate-limit answered 503 (Reviews' entity
# pages under a crawl, among them).
limit_req_status 429;
limit_conn_status 429;
