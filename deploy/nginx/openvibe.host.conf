## REFERENCE copy of `ovhost nginx tenants host` output with no custom domains (regenerate it with
## that command; install with --install, which also writes the custom-domain vhost and removes
## openvibe.host-tenants-pending.conf in the same nginx -t and reload).
## ═══════════════════════════════════════════════════════════════
## openvibe.host and *.openvibe.host — generated by `ovhost nginx tenants host`
##
## OpenVibe.Host Stage B (tenant static hosting), port 4910.
##   openvibe.host          the dashboard and the Host API (/api/v1), uploads up to 110m
##   *.openvibe.host      tenant sites: GET/HEAD only, cookies stripped both ways
## Wildcard certificate: /etc/letsencrypt/live/openvibe.host (issued by the operator with a DNS-01 challenge; see README).
## `--install` writes /etc/nginx/sites-available/openvibe.host.conf, links it, and reloads nginx only if `nginx -t` passes.
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=ovhost_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ovhost_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ovhost_sites:20m rate=50r/s;

# ── HTTP → HTTPS ───────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name openvibe.host *.openvibe.host;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ── Dashboard + API ────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.host;

    ssl_certificate     /etc/letsencrypt/live/openvibe.host/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.host/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.host.access.log;
    error_log  /var/log/nginx/openvibe.host.error.log;

    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /auth/ {
        limit_req zone=ovhost_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:4910;
    }

    # Deploy uploads (API and dashboard form): large bodies, streamed to the service.
    location ~ ^/(api/v1/)?sites/[A-Za-z0-9_]+/deploys$ {
        limit_req zone=ovhost_api burst=10 nodelay;
        client_max_body_size 110m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://127.0.0.1:4910;
    }

    location /api/ {
        limit_req zone=ovhost_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:4910;
    }

    # Prometheus metrics: host-local scrapers only (http://127.0.0.1:4910/metrics).
    location = /metrics { return 404; }

    location / {
        limit_req zone=ovhost_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:4910;
    }
}

# ── www.openvibe.host → openvibe.host ─────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.host;

    ssl_certificate     /etc/letsencrypt/live/openvibe.host/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.host/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://openvibe.host$request_uri;
}

# ── Tenant sites ───────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name *.openvibe.host;

    ssl_certificate     /etc/letsencrypt/live/openvibe.host/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.host/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/sites.openvibe.host.access.log;
    error_log  /var/log/nginx/sites.openvibe.host.error.log;

    # Static files only: no request bodies, no cookies in either direction.
    client_max_body_size 1k;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        limit_except GET HEAD { deny all; }
        limit_req zone=ovhost_sites burst=200 nodelay;
        proxy_pass http://127.0.0.1:4910;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Set-Cookie;
        proxy_read_timeout 60s;
    }

}
