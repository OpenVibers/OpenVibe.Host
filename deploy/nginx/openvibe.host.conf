## OpenVibe.Host hosting comparison catalog on openvibe.host.

limit_req_zone $binary_remote_addr zone=ovhost_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ovhost_auth:10m rate=10r/m;

# ── HTTP → HTTPS ───────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name openvibe.host;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ── Catalog + API ────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.host;
    include snippets/security-txt.conf;   # /.well-known/security.txt (the host's file)

    ssl_certificate     /etc/letsencrypt/live/openvibe.host/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.host/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.host.access.log;
    error_log  /var/log/nginx/openvibe.host.error.log;

    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # GET /auth/me runs on every page load (the navbar's session): the API zone, not the sign-in flow's 10/min,
    # or a visitor who opens a dozen pages in a minute shows as signed out (the browser check's 429s, 2026-10-17).
    location = /auth/me {
        limit_req zone=ovhost_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:4910;
    }
    location /auth/ {
        limit_req zone=ovhost_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:4910;
    }

    location /api/ {
        limit_req zone=ovhost_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:4910;
    }

    # Prometheus metrics: host-local scrapers only (http://127.0.0.1:4910/metrics).
    location = /metrics { return 404; }

    location / {
        limit_req zone=ovhost_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:4910;
    }
}

# ── www.openvibe.host → openvibe.host ─────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.host;

    ssl_certificate     /etc/letsencrypt/live/openvibe.host/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.host/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://openvibe.host$request_uri;
}
