# OpenVibe: a friendly page while a service restarts or is down, instead of Cloudflare's 502 page (owner, 2026-10-31).
#
# Only nginx's own 502 and 504 (the upstream refused the connection or timed out) are caught: responses the app sends
# itself pass through as they are (proxy_intercept_errors stays off). They become a 503 with Retry-After, because
# Cloudflare shows an origin's 503 page as it is but swaps an origin's 502 and 504 for its own error page.
# The page (/var/www/openvibe-down/down.html) has no outside assets, and reloads itself once the site answers again.
# Included at server level from security-txt.conf, so every vhost that serves security.txt gets it.
error_page 502 504 =503 @ov_down;
location @ov_down {
    root /var/www/openvibe-down;
    add_header Retry-After 5 always;
    add_header Cache-Control "no-store" always;
    add_header X-OpenVibe-Down "1" always;
    rewrite ^ /down.html break;
}
