# A prefix drop-in: systemd applies it to every openvibe-*.service. Each starts after PostgreSQL, PgBouncer
# and Valkey have started, so a service connecting at boot never meets a database that is not accepting
# logins yet. Ordering only: a unit that uses none of them does not pull them in.
# Installed by `ovhost deploy host --install-units` (unitSources of the host service).
[Unit]
After=postgresql.service pgbouncer.service valkey-server.service
