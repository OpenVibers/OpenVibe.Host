# PgBouncer starts after PostgreSQL. Started first, it answers clients while PostgreSQL is still refusing
# logins and then caches that failure for server_login_retry seconds, so every service that connected
# early exits once (the 2026-10-23 reboot: ten services and OpenRestream's coordinator).
# Installed by `ovhost deploy host --install-units` (unitSources of the host service).
[Unit]
After=postgresql.service
